<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Akan Name Generator</h1>
    <p>Enter your birthday and gender in order to find out your
        Akan name. Get a chance to discover your traditional Akan name.
    What other names could you have?</p>
        <form id="akanForm">
            <label for="day">Day:</label><br>
            <input type="number" id="day">

            <label for="month">Month:</label><br>
            <select id="month">
                <option value="">Select Month</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            placeholder="Month">
            </select>

            <label for="year">Year:</label><br>
            <input type="number" id="year"
            placeholder="Year">
            <div class="gender">
            <p>Gender:</p>

            <input type="radio" id="male"
            name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="Female"
            name="gender" value="Female">
            <label for="female">Female</label>
            </div>
            

            <button type="submit">Get your Akan Name</button>
        </form>
    </div>

        <h2 id="result"></h2>
        <script src="script.js"></script>
    
</body>
</html>
